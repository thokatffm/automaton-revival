name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        include:
          # The fork is developed on Windows; keep the path handling honest there.
          - os: windows-latest
            node-version: 26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      # The suite used to hang (quadratic tokenizer work), which is why the old
      # workflow wrapped it in `timeout` and treated a kill as success. That
      # bug is fixed, so a timeout is now a real failure.
      - name: Run tests
        timeout-minutes: 15
        run: pnpm test
      - name: Run security-focused tests
        timeout-minutes: 10
        run: pnpm run test:security

  docker-integration:
    name: docker sandbox integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run real-Docker tests
        timeout-minutes: 10
        env:
          AUTOMATON_DOCKER_IT: "1"
        run: pnpm exec vitest run src/__tests__/backends/docker.integration.test.ts

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A gate that cannot fail is not a gate: no `|| true`.
      # One low-severity esbuild advisory (vite dev server only) is accepted.
      - run: pnpm audit --audit-level=moderate
